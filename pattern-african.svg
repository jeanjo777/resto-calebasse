<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none" opacity="0.06">
  <!-- Adinkra-inspired diamond grid -->
  <path d="M100 10 L130 50 L100 90 L70 50 Z" stroke="#c8952e" stroke-width="1.5"/>
  <path d="M100 110 L130 150 L100 190 L70 150 Z" stroke="#c8952e" stroke-width="1.5"/>
  <path d="M0 60 L30 100 L0 140" stroke="#c8952e" stroke-width="1.5"/>
  <path d="M200 60 L170 100 L200 140" stroke="#c8952e" stroke-width="1.5"/>
  <!-- Cross marks -->
  <line x1="95" y1="50" x2="105" y2="50" stroke="#c8952e" stroke-width="1.5"/>
  <line x1="100" y1="45" x2="100" y2="55" stroke="#c8952e" stroke-width="1.5"/>
  <line x1="95" y1="150" x2="105" y2="150" stroke="#c8952e" stroke-width="1.5"/>
  <line x1="100" y1="145" x2="100" y2="155" stroke="#c8952e" stroke-width="1.5"/>
  <!-- Dots -->
  <circle cx="50" cy="10" r="2" fill="#c8952e"/>
  <circle cx="150" cy="10" r="2" fill="#c8952e"/>
  <circle cx="50" cy="190" r="2" fill="#c8952e"/>
  <circle cx="150" cy="190" r="2" fill="#c8952e"/>
  <circle cx="100" cy="100" r="3" fill="#c8952e"/>
</svg>
